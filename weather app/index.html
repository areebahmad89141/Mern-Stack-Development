<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather App</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #333;
        }

        form {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"] {
            width: calc(100% - 22px); /* full width minus padding and border */
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box; /* include padding and border in element's total width and height */
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #weather-info {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        #weather-info h2 {
            margin: 0;
            font-size: 24px;
            color: #333;
        }

        #weather-info p {
            margin: 10px 0;
            font-size: 18px;
            color: #555;
        }

        /* Error message styling */
        #weather-info p.error {
            color: red;
        }
    </style>
</head>

<body>
    <h1>Weather App</h1>
    <form onsubmit="getweather(); return false;">
        <label for="cityname">City Name</label>
        <input type="text" name="cityname" id="temp1" placeholder="Enter city name">
        <button type="submit">check weather</button>
    </form>
    <div id="weather-info"></div>


    <script>
        function getweather() {
            let pickcityName = document.querySelector("#temp1").value;
            axios.get(`https://api.weatherapi.com/v1/current.json?key=cc709938c8f34514a57113722242208&q=${pickcityName}&aqi=yes`)
                .then(function (response) {
                     const weather =response.data;
                    const tempC = weather.current.temp_c;
                    document.querySelector("#weather-info").innerHTML = (`
            <h2>Weather in ${weather.location.name}, ${weather.location.country}</h2>
            <p><strong>Temperature:</strong> ${tempC}°C</p>
          `);

                })
                .catch(function (error) {
                    // handle error
                    console.log(error);
                })



        }


    </script>


</body>

</html>
